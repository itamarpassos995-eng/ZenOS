name: P0 Firestore Listener Lifecycle
on:
  pull_request:
    paths:
      - 'src/App.jsx'
      - 'src/core/operationalRepository.js'
      - 'src/components/Mesas.jsx'
      - 'src/components/PDV.jsx'
      - 'src/components/PDVCompras.jsx'
      - 'scripts/recovery/firestore-listener-lifecycle.ui.test.jsx'
      - 'scripts/recovery/listener-lifecycle-check.mjs'
      - '.github/workflows/p0-firestore-listener-lifecycle.yml'
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/recovery/listener-lifecycle-check.mjs
      - run: npx vitest run --config vitest.recovery.config.js scripts/recovery/firestore-listener-lifecycle.ui.test.jsx
      - run: node scripts/release-check.mjs
      - run: npm run build
