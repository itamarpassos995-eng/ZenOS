name: Commerce Product Editor CI
on:
  pull_request:
    paths:
      - 'functions/src/commerce*.js'
      - 'functions/test/commerce*.test.mjs'
      - 'src/core/commerce*.js'
      - 'src/components/ZenCommerce*.jsx'
      - 'src/components/Produtos.jsx'
      - 'src/components/Configuracoes.jsx'
      - 'src/components/ZenCommerceStorefront.jsx'
      - 'src/commerce.css'
      - 'src/App.jsx'
      - 'src/main.jsx'
      - 'src/firebase.js'
      - 'src/core/runtimeEnvironment.js'
      - 'src/components/ZenCommerceOperationalHmlGate.jsx'
      - 'firestore.commerce.operational-hml.rules'
      - 'firebase.commerce.operational-rules-test.json'
      - 'firebase.commerce.operational-rules-release.json'
      - 'firebase.commerce.operational-rules-rollback.json'
      - 'scripts/commerce-operational-hml-rules-release.mjs'
      - 'firebase.commerce.operational-preview.json'
      - 'scripts/commerce-operational-hml-preview.mjs'
      - 'scripts/commerce-operational-hml-seed-deploy.mjs'
      - 'scripts/commerce-hml-session-deploy.mjs'
      - 'scripts/commerce-hml-tenant-boundary-deploy.mjs'
      - 'src/core/commerceHmlTenantBoundary.js'
      - 'scripts/commerce-operational-hml-remote-audit.mjs'
      - 'scripts/commerce-operational-rules-emulator-check.mjs'
      - 'vite.config.js'
      - 'scripts/commerce-cloud-hml-*.mjs'
      - 'firebase.commerce.cloud-hml.json'
      - 'firestore.commerce.cloud-hml.rules'
      - 'storage.commerce.cloud-hml.rules'
      - 'scripts/commerce-preview-build.mjs'
      - 'scripts/commerce-checkout-recovery-check.mjs'
      - 'scripts/commerce-emulator-check.mjs'
      - 'scripts/commerce-pdv-emulator-check.mjs'
      - 'src/core/productionSync.js'
      - 'src/core/operationalV2.js'
      - 'src/core/pdvDraft.js'
      - 'src/components/PDV.jsx'
      - 'firestore.commerce.homologacao.rules'
      - 'scripts/recovery/commerce-pdv*.ui.test.jsx'
      - 'scripts/commerce-tenant-hml-emulator-check.mjs'
      - 'scripts/recovery/commerce-checkout.ui.test.jsx'
      - 'scripts/recovery/commerce-session.ui.test.jsx'
      - 'src/components/TerminalLogin.jsx'
      - '.github/workflows/commerce-product-editor-ci.yml'
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Proof of isolated Commerce cloud build (no credentials/network)
        run: node scripts/commerce-cloud-hml-safety-check.mjs
      - name: Isolated preview configuration preflight (offline)
        run: node scripts/commerce-operational-hml-preview.mjs --check
      - name: Operational HML seed deploy preflight (offline; no deploy)
        run: node scripts/commerce-operational-hml-seed-deploy.mjs --check
      - name: Commerce integrated session deploy preflight (offline; no deploy)
        run: node scripts/commerce-hml-session-deploy.mjs --check
      - name: Commerce HML tenant-boundary deploy preflight (offline; no deploy)
        run: node scripts/commerce-hml-tenant-boundary-deploy.mjs --check
      - name: Operational HML Firestore rules-only release preflight (no network)
        run: node scripts/commerce-operational-hml-rules-release.mjs --check
      - name: Seed environment must reject divergent HML flags
        run: |
          set -eu
          envfile=functions/.env.zenos-commerce-homologacao
          test ! -e "$envfile"
          printf 'ZENOS_COMMERCE_MEDIA_ENABLED=false\n' > "$envfile"
          if node scripts/commerce-operational-hml-seed-deploy.mjs --check; then
            echo "ERRO: ambiente inseguro aceito" >&2
            exit 1
          fi
          printf 'ZENOS_COMMERCE_MEDIA_ENABLED=true\nZENOS_COMMERCE_HOMOLOGACAO=true\nZENOS_COMMERCE_STORAGE_BUCKET=zenos-commerce-homologacao.firebasestorage.app\n' > "$envfile"
          node scripts/commerce-operational-hml-seed-deploy.mjs --check
          rm "$envfile"
      - name: Firebase remote audit preflight (offline; no cloud access)
        run: node scripts/commerce-operational-hml-remote-audit.mjs --check
      - name: Compile operational HML preview from fake SDK only (no cloud)
        env:
          VITE_ZENOS_COMMERCE_HML_FIREBASE_CONFIG: '{"projectId":"zenos-commerce-homologacao","authDomain":"zenos-commerce-homologacao.firebaseapp.com","storageBucket":"zenos-commerce-homologacao.firebasestorage.app","appId":"1:000000000000:web:demo","apiKey":"demo-no-credentials"}'
        run: node scripts/commerce-operational-hml-preview.mjs --build
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: node --test scripts/commerce-checkout-recovery-check.mjs
      - run: node node_modules/vitest/vitest.mjs run --config vitest.recovery.config.js scripts/recovery/commerce-*.ui.test.jsx
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
        working-directory: functions
      - name: Two stores, media, order recovery and idempotency on local emulators only
        env:
          GCLOUD_PROJECT: demo-zenos-local
          ZENOS_COMMERCE_MEDIA_ENABLED: 'true'
          ZENOS_COMMERCE_HOMOLOGACAO: 'true'
          ZENOS_COMMERCE_STORAGE_BUCKET: demo-zenos-local.appspot.com
        run: node scripts/commerce-emulator-check.mjs

  rules-operational-hml:
    name: Firestore Operational HML Rules (isolated emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install emulator-only rules harness (not persisted in app manifest)
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @firebase/rules-unit-testing@5.0.2
      - name: Verify strict Firestore HML rules on synthetic data only
        env:
          GCLOUD_PROJECT: demo-zenos-local
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        run: npx --yes firebase-tools@15.34.0 emulators:exec --project demo-zenos-local --config firebase.commerce.operational-rules-test.json --only firestore 'node scripts/commerce-operational-rules-emulator-check.mjs'
