name: ZenOS AutoUpdate V1
on:
  pull_request:
    paths:
      - 'api/version.js'
      - 'src/core/autoUpdate.js'
      - 'src/App.jsx'
      - 'src/main.jsx'
      - 'vite.config.js'
      - 'vercel.json'
      - 'scripts/auto-update.test.mjs'
      - '.github/workflows/zenos-autoupdate-v1.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test scripts/auto-update.test.mjs
      - run: npm run build
