name: Commerce Private Inbox - Zero Firestore Reads
on:
  pull_request:
    paths:
      - 'api/commerce/inbox.js'
      - 'src/components/CommerceOrderInbox.jsx'
      - 'src/components/ZenCommerceStorefront.jsx'
      - 'src/commerce-homologacao-main.jsx'
      - 'src/App.jsx'
      - 'src/components/PDV.jsx'
      - 'scripts/commerce-private-inbox.test.mjs'
      - 'scripts/commerce-private-blob-driver.test.mjs'
      - 'api/commerce/_lib/privateBlobStore.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/commerce-private-inbox-ci.yml'
permissions:
  contents: read
jobs:
  private-inbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate restricted scope and zero extra Firestore listeners
        run: node --test scripts/commerce-private-inbox.test.mjs scripts/commerce-private-blob-driver.test.mjs
      - name: Syntax validation
        run: node --check api/commerce/inbox.js
      - name: Production compile
        run: |
          npm run build
