name: Distribution phase 2 homologation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**/distribution/**'
      - 'src/components/DistributionCentral*'
      - 'src/App.jsx'
      - 'src/distribution-homologacao-main.jsx'
      - 'distribution-homologacao.html'
      - 'src/core/zenReceiptPdf.js'
      - 'vite.config.js'
      - 'package.json'
      - 'vitest.distribution.config.js'
      - 'src/core/inventory.js'
      - 'src/core/productionSync.js'
      - 'operational-functions/src/distribution/**'
      - 'operational-functions/test/distribution/**'
      - 'scripts/distribution/**'
      - 'firebase.distribution.json'
      - 'firestore.distribution-emulator.rules'
      - '.github/workflows/distribution-phase2.yml'
permissions:
  contents: read
jobs:
  homologation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix operational-functions
      - run: node --test scripts/distribution/*.test.mjs scripts/inventory-negative-stock.test.mjs scripts/card-multicurrency.test.mjs
      - run: npm run build
      - run: npx --yes firebase-tools@15.30.2 emulators:exec --only auth,firestore --project demo-zenos-local --config firebase.distribution.json 'node scripts/distribution/homologate.mjs'
