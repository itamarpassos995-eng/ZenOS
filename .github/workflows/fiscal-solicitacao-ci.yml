name: Fiscal onboarding CI
on:
  pull_request:
    paths:
      - 'src/components/Fiscal*.jsx'
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/fiscal-solicitacao-ci.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Frontend dependencies
        run: npm ci
      - name: Fiscal UI smoke tests
        run: npm run test:fiscal-boot
      - name: Frontend production build
        run: npm run build
      - name: Backend dependencies
        working-directory: functions
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Backend tests
        working-directory: functions
        run: npm run check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fiscal onboarding e2e (emuladores)
        run: npx --yes firebase-tools@15.30.2 emulators:exec --only auth,firestore,functions --project demo-zenos-local "node scripts/fiscal-onboarding-emulator-check.mjs"
