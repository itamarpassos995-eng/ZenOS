name: Caixa Multimoeda P0 (Homologacao)
on:
  pull_request:
    paths:
      - 'src/App.jsx'
      - 'src/components/PDV.jsx'
      - 'src/core/cashSession.js'
      - 'src/core/cashMoneyInput.js'
      - 'scripts/cash-multicurrency-p0-check.mjs'
      - '.github/workflows/cash-multicurrency-p0.yml'
  workflow_dispatch:
jobs:
  caixa-p0:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Regressao Caixa Multimoeda P0
        run: node scripts/cash-multicurrency-p0-check.mjs
      - name: Testes historicos financeiros
        run: |
          npm run test:att07
          npm run test:att082
          npm run test:att083
      - name: Build seguro (mesmo quando teste legado falhar)
        if: always()
        run: npm run build
