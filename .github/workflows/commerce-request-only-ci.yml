name: Commerce Request and Settings Safety
on:
  pull_request:
    paths:
      - 'src/App.jsx'
      - 'src/components/CommerceSolicitacao.jsx'
      - 'src/components/CommerceSolicitacao.css'
      - 'src/core/commerceConfig.js'
      - 'src/main.jsx'
      - 'src/components/CommerceVitrinePreview.jsx'
      - 'src/components/CommerceVitrinePreview.css'
      - 'scripts/recovery/commerce-preview.ui.test.jsx'
      - 'vercel.json'
      - 'functions/src/index.js'
      - 'functions/src/commerceSolicitacaoCliente.js'
      - 'functions/src/commerceInteresseCore.js'
      - 'functions/test/commerceInteresseCore.test.mjs'
      - 'scripts/recovery/commerce-request.ui.test.jsx'
      - 'scripts/commerce-request-release-audit.mjs'
      - '.github/workflows/commerce-request-only-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Packages for callable syntax
        run: npm install --prefix functions --package-lock=false --ignore-scripts --no-audit --no-fund
      # Este gate protege a solicitação Commerce e a nova tela de configurações.
      # Alterações P0 de caixa em App.jsx não são um pacote Commerce.
      - name: Detect Commerce request changes
        id: commerce_scope
        shell: bash
        run: |
          git fetch --no-tags origin main
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          if printf '%s\n' "$CHANGED" | grep -Eq '^(src/components/CommerceSolicitacao\\.|src/core/commerceConfig\\.js$|functions/src/(index\\.js|commerceSolicitacaoCliente\\.js|commerceInteresseCore\\.js)|functions/test/commerceInteresseCore\\.test\\.mjs|scripts/(recovery/commerce-request\\.ui\\.test\\.jsx|commerce-request-release-audit\\.mjs)|docs/commerce-request-only-release-20261019\\.md|\\.github/workflows/(commerce-request-only-ci|deploy-fiscal-functions)\\.yml)'; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$CHANGED" | grep -Eq '^(src/main\.jsx|src/components/CommerceVitrinePreview\.(jsx|css)|scripts/recovery/commerce-preview\.ui\.test\.jsx|vercel\.json)$'; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif git diff --unified=0 origin/main...HEAD -- src/App.jsx | grep -Eq '^[+-][^+-].*(CommerceSolicitacao|commerceSolicitacaoCliente|commerceInteresse|commerce-request|solicitacaoCommerce)'; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Package isolation and V1 V2 regression guards
        if: steps.commerce_scope.outputs.enabled == 'true'
        run: node scripts/commerce-request-release-audit.mjs
      - name: Pure request and auth tests
        run: node --test functions/test/commerceInteresseCore.test.mjs
      - name: Frontend request and settings tests
        run: npx vitest run --config vitest.recovery.config.js scripts/recovery/commerce-request.ui.test.jsx scripts/recovery/commerce-preview.ui.test.jsx
      - name: Static syntax and production build
        run: |
          node --check functions/src/commerceInteresseCore.js
          node --check functions/src/commerceSolicitacaoCliente.js
          npm run build
