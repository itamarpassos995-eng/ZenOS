name: VIPE importador - build
on:
  pull_request:
    paths:
      - 'src/components/ImportacaoVipe.jsx'
      - 'src/components/Migracao.jsx'
      - 'src/App.jsx'
      - '.github/workflows/vipe-import-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
