name: VIPE importador - build
on:
  pull_request:
    paths:
      - 'src/components/ImportacaoVipe.jsx'
      - 'src/components/Migracao.jsx'
      - 'src/App.jsx'
      - 'scripts/vipe-import-emulator.mjs'
      - '.github/workflows/vipe-import-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Testar lote sintético no emulador
        run: npx --yes firebase-tools@15.30.2 emulators:exec --only auth,firestore --project demo-zenos-local "node scripts/vipe-import-emulator.mjs"
