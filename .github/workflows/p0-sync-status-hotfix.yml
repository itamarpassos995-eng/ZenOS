name: P0 Sync Status Cloud Confirmed
on:
  pull_request:
    paths:
      - 'src/App.jsx'
      - 'scripts/recovery/sync-confirmed-health.test.mjs'
      - '.github/workflows/p0-sync-status-hotfix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/recovery/sync-confirmed-health.test.mjs
      - run: npm run build
