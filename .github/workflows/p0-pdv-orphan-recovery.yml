name: P0 PDV Orphan Index Recovery
on:
  pull_request:
    paths:
      - 'src/core/productOrphanReleaseCore.js'
      - 'src/core/productOrphanRelease.js'
      - 'src/components/Produtos.jsx'
      - 'scripts/recovery/product-pdv-orphan-release.test.mjs'
      - '.github/workflows/p0-pdv-orphan-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/recovery/product-pdv-orphan-release.test.mjs
      - run: npm run build
