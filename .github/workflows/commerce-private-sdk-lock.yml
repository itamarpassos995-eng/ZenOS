name: Preparar lock do SDK privado Commerce
on:
  push:
    branches: [feat/commerce-fila-privada-sem-firestore]
    paths:
      - package.json
      - .github/workflows/commerce-private-sdk-lock.yml
permissions:
  contents: write
jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Gerar lock estritamente da dependencia revisada
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --package-lock=true
      - name: Validar integridade do lock
        run: node -e "const j=require('./package-lock.json'); if(!j.packages['node_modules/@vercel/blob'] || !j.packages[''].dependencies['@vercel/blob']) process.exit(1)"
      - name: Publicar apenas o lock na branch de homologacao
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet || (git commit -m 'chore: lock oficial do SDK Vercel Blob privado' && git push origin HEAD:feat/commerce-fila-privada-sem-firestore)
