name: Distribution domain foundation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/core/distribution/**'
      - 'scripts/distribution/**'
      - '.github/workflows/distribution-foundation.yml'
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/distribution/*.test.mjs
