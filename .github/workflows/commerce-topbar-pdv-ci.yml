name: Commerce — Cabeçalho e PDV sem novas leituras
on:
  pull_request:
    paths:
      - 'src/App.jsx'
      - 'src/components/PDV.jsx'
      - 'src/components/ZenVisualLayout.jsx'
      - 'src/zenos-dashboard.css'
      - 'scripts/commerce-topbar-pdv.test.mjs'
      - '.github/workflows/commerce-topbar-pdv-ci.yml'
permissions:
  contents: read
jobs:
  atalho-pdv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar alterações restritas e listeners Firestore
        run: node --test scripts/commerce-topbar-pdv.test.mjs
      - name: Confirmar ausência de alterações operacionais
        run: |
          git diff --name-only origin/main...HEAD | tee /tmp/commerce-files.txt
          # Exceção financeira restrita: somente a guarda transacional nativa,
          # verificada no teste anterior; demais arquivos persistentes protegidos.
          ! grep -E '^src/firebase\.js$|^src/core/operationalRepository\.js$|^firestore\.emulator\.rules$' /tmp/commerce-files.txt
          if grep -Fxq 'src/core/productionSync.js' /tmp/commerce-files.txt; then
            grep -Fq "guard.type === 'cash_native_balance_at_least'" src/core/productionSync.js
            grep -Fq 'calcularConciliacaoFisicaMultimoeda' src/core/productionSync.js
          fi
