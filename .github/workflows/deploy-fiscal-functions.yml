name: Deploy ZenOS Fiscal (somente Functions)
run-name: Publicar funções fiscais em zenos-ac6b2

on:
  workflow_dispatch:
    inputs:
      project_confirmation:
        description: 'Confirme o projeto digitando zenos-ac6b2'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: zenos-fiscal-functions-production
  cancel-in-progress: false

jobs:
  deploy-fiscal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: fiscal-production
    timeout-minutes: 25
    steps:
      - name: Conferir confirmação explícita e repositório
        env:
          PROJECT_CONFIRMATION: ${{ inputs.project_confirmation }}
        run: |
          test "$GITHUB_REPOSITORY" = "itamarpassos995-eng/ZenOS"
          test "$PROJECT_CONFIRMATION" = "zenos-ac6b2"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Conferir escopo de implantação sem Firestore rules
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const cfg = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          assert.equal(cfg.functions?.source, 'functions');
          assert.equal(cfg.functions?.codebase, 'fiscal');
          const index = fs.readFileSync('functions/src/index.js', 'utf8');
          for (const fn of ['fiscalSolicitacaoCliente','fiscalAdministracao','fiscalBackendStatus']) {
            assert.match(index, new RegExp('export\\s+\\{\\s*'+fn+'\\s*\\}'));
          }
          const exports = [...index.matchAll(/export\s+\{\s*(\w+)\s*\}/g)].map(m => m[1]).sort();
          assert.deepEqual(exports, ['commerceSolicitacaoCliente','fiscalAdministracao','fiscalBackendStatus','fiscalSolicitacaoCliente']);
          console.log('Escopo aprovado: apenas 3 funções fiscais; Commerce é independente e não será reimplantado.');
          NODE

      - name: Validar testes das Functions
        working-directory: functions
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npm run check

      - name: Conferir identificadores públicos da identidade do workflow
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience', 'https://iam.googleapis.com/projects/411148782192/locations/global/workloadIdentityPools/zenos-fiscal-github/providers/zenos-main-fiscal');
          const response = await fetch(url, { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } });
          assert(response.ok, 'Identidade OIDC indisponível.');
          const { value } = await response.json();
          const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url'));
          const fields = ['repository','repository_id','repository_owner_id','ref','workflow_ref','sub'];
          console.log(JSON.stringify(Object.fromEntries(fields.map(field => [field, claims[field]]))));
          NODE

      - name: Autenticar com identidade federada restrita ao workflow fiscal
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/411148782192/locations/global/workloadIdentityPools/zenos-fiscal-github/providers/zenos-main-fiscal
          service_account: zenos-fiscal-deployer@zenos-ac6b2.iam.gserviceaccount.com
          project_id: zenos-ac6b2
          create_credentials_file: true

      - name: Publicar somente 3 Cloud Functions fiscais
        env:
          FUNCTIONS_DISCOVERY_TIMEOUT: '120'
        run: |
          npx --yes firebase-tools@15.30.2 deploy \
            --project zenos-ac6b2 \
            --only "functions:fiscal:fiscalSolicitacaoCliente,functions:fiscal:fiscalAdministracao,functions:fiscal:fiscalBackendStatus" \
            --non-interactive

      - name: Conferir funções publicadas
        run: |
          npx --yes firebase-tools@15.30.2 functions:list --project zenos-ac6b2 | tee /tmp/zenos-fiscal-functions.txt
          grep -q "fiscalSolicitacaoCliente" /tmp/zenos-fiscal-functions.txt
          grep -q "fiscalAdministracao" /tmp/zenos-fiscal-functions.txt
          grep -q "fiscalBackendStatus" /tmp/zenos-fiscal-functions.txt

      - name: Conferir disponibilidade e bloqueio de acesso anônimo
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          for (const name of ['fiscalSolicitacaoCliente','fiscalAdministracao','fiscalBackendStatus']) {
            const response = await fetch(`https://southamerica-east1-zenos-ac6b2.cloudfunctions.net/${name}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ data: {} }),
              signal: AbortSignal.timeout(90000),
            });
            const data = await response.json();
            assert.equal(response.status, 401);
            assert.equal(data.error?.status, 'UNAUTHENTICATED');
            console.log(`${name}: disponível e protegido por autenticação.`);
          }
          NODE

