name: Commerce CDN Homologacao
on:
  pull_request:
    paths:
      - 'src/core/commercePublicCatalog.js'
      - 'scripts/commerce-cdn-homologacao.test.mjs'
      - 'docs/ARQUITETURA_COMMERCE_PUBLICO.md'
      - '.github/workflows/commerce-cdn-homologacao-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-catalog-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Testar contrato puro sem Firestore
        run: node --test scripts/commerce-cdn-homologacao.test.mjs
      - name: Compilar frontend atual sem alterar produção
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
