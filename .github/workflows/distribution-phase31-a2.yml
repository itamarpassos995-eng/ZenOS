name: Distribution Phase 3.1 A.2 validation
on:
  workflow_dispatch:
  push:
    branches:
      - feat/distribution-logistics-foundation
    paths:
      - 'operational-functions/src/distribution/**'
      - 'operational-functions/test/distribution/occurrences.test.mjs'
      - 'src/core/distribution/**'
      - 'src/components/DistributionCentral.jsx'
      - 'src/components/DistributionOccurrences.*'
      - 'scripts/distribution/phase31-foundation.test.mjs'
      - '.github/workflows/distribution-phase31-a2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix operational-functions
      - name: Phase 3.1 foundation tests
        run: node --test scripts/distribution/phase31-foundation.test.mjs
      - name: React build
        run: npm run build
      - name: Firebase Emulator V2 integration tests
        run: npx --yes firebase-tools@15.30.2 emulators:exec --only auth,firestore --project demo-zenos-local --config firebase.distribution-v2.json 'node --test operational-functions/test/distribution/occurrences.test.mjs'
